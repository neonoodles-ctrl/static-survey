[project]
name = "static-survey"
version = "0.1.0"
description = "Rigorous least squares adjustment and cause-finding diagnosis for mine survey control networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyproj>=3.6",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
static-survey = "static_survey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/static_survey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
